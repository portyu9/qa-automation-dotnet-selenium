name: apply-security-diagram-rescan

on:
  push:
    branches: [docs/security-diagram-rescan]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: docs/security-diagram-rescan
      - name: Align security architecture with required NuGet audit
        shell: python
        run: |
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text(encoding='utf-8')
          old = '    SAST[CodeQL] --> SG[Security / security-gate]\n    TRIVY[Trivy repository scan] --> SG\n'
          new = '    SAST[CodeQL] --> SG[Security / security-gate]\n    AUDIT[NuGet locked audit] --> SG\n    TRIVY[Trivy repository scan] --> SG\n'
          if s.count(old) != 1:
              raise SystemExit('expected one .NET security gate fragment')
          s = s.replace(old, new, 1)
          old_class = '    class CIG,EG,DG,SAST,TRIVY,REVIEW,SG gate;\n'
          new_class = '    class CIG,EG,DG,SAST,AUDIT,TRIVY,REVIEW,SG gate;\n'
          if s.count(old_class) != 1:
              raise SystemExit('expected one .NET security class fragment')
          p.write_text(s.replace(old_class, new_class, 1), encoding='utf-8')
      - name: Commit README correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md
          git diff --cached --check
          git commit -m 'docs: show required NuGet audit in security architecture'
          git push origin HEAD:docs/security-diagram-rescan
