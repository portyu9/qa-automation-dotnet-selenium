name: refresh-net10-lock

on:
  push:
    branches: [audit/dotnet10-security-hardening]
    paths:
      - "UiTests.csproj"
      - "global.json"
      - "packages.lock.json"
      - ".github/workflows/refresh-net10-lock.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-net10-lock
  cancel-in-progress: true

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: audit/dotnet10-security-hardening
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400
      - name: Regenerate dependency graph from declared packages
        run: dotnet restore UiTests.csproj --force-evaluate
      - name: Prove regenerated graph is lock-stable and audit-clean
        run: dotnet restore UiTests.csproj --locked-mode
      - name: Commit regenerated lock when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- packages.lock.json; then
            echo 'packages.lock.json is already current.'
            exit 0
          fi
          git diff -- packages.lock.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages.lock.json
          git commit -m 'build: regenerate .NET 10 dependency lock'
          git push origin HEAD:audit/dotnet10-security-hardening
