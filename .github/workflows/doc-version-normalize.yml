name: normalize-versionless-docs
on:
  push:
    branches: [chore/versionless-docs]
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Normalize .NET documentation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          files=[Path('README.md'),*sorted(Path('docs').rglob('*.md'))]
          techs=['.NET','xUnit','Selenium','WebDriver','NuGet','Chrome','Chromium','Firefox','Edge','Trivy','CodeQL']
          exact={
            '.NET 10 LTS':'.NET LTS','.NET 10':'.NET','xUnit v3':'xUnit','SDK `10.0.400`':'repository-selected SDK','SDK 10.0.400':'repository-selected SDK','`net10.0`':'the configured target framework','net10.0':'the configured target framework'
          }
          for path in files:
            text=path.read_text(encoding='utf-8')
            for a,b in exact.items(): text=text.replace(a,b)
            for tech in techs:
              text=re.sub(rf'(?i)(?<![\w]){re.escape(tech)}\s+(?:\*\*|`)?v?\d+(?:\.\d+)*(?:\.x)?(?:\s+LTS)?(?:\*\*|`)?',tech,text)
            text=re.sub(r'(?i)\bSDK\s+(?:`)?\d+(?:\.\d+)*(?:`)?','repository-selected SDK',text)
            text=re.sub(r'(?i)\bnet\d+(?:\.\d+)?\b','configured target framework',text)
            path.write_text(text,encoding='utf-8')
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re
          names=r'(?:\.NET|xUnit|Selenium|WebDriver|NuGet|Chrome|Chromium|Firefox|Edge|Trivy|CodeQL)'
          pats=[re.compile(rf'(?i)(?<![\w]){names}\s+(?:\*\*|`)?v?\d+(?:\.\d+)*(?:\.x)?'),re.compile(r'(?i)\bSDK\s+`?\d'),re.compile(r'(?i)\bnet\d+(?:\.\d+)?\b')]
          bad=[]
          for p in [Path('README.md'),*sorted(Path('docs').rglob('*.md'))]:
            for n,l in enumerate(p.read_text(encoding='utf-8').splitlines(),1):
              if any(x.search(l) for x in pats): bad.append(f'{p}:{n}: {l}')
          if bad: print('\n'.join(bad)); raise SystemExit(1)
          PY
          python3 .github/scripts/validate_readme.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/doc-version-normalize.yml
          git add -A
          git diff --cached --check
          git commit -m "docs: make technology documentation versionless"
          git push origin HEAD
