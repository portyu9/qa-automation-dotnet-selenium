name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dotnet-selenium-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DOTNET_SDK_VERSION: 10.0.400
      TEST_BASE_URL: http://127.0.0.1:3200
      TEST_BROWSER: chrome
      TEST_HEADLESS: "true"
      TEST_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400
      - name: Verify pinned SDK and MTP runner selection
        run: |
          set -euo pipefail
          [[ "$(dotnet --version)" == "$DOTNET_SDK_VERSION" ]] || {
            echo "unexpected .NET SDK: $(dotnet --version)" >&2
            exit 1
          }
          grep -F '"runner": "Microsoft.Testing.Platform"' global.json
      - name: Validate immutable workflow dependencies
        run: python .github/scripts/validate_workflow_pins.py
      - name: Restore locked dependency graph and audit HIGH/CRITICAL advisories
        run: dotnet restore UiTests.csproj --locked-mode
      - name: Build with warnings as errors
        run: dotnet build UiTests.csproj --configuration Release --no-restore
      - name: Test against repository-owned loopback fixture
        run: >-
          dotnet test UiTests.csproj
          --configuration Release
          --no-build
          --results-directory TestResults
          --report-trx
          --report-trx-filename tests.trx
          --coverlet
          --coverlet-output-format cobertura
          --coverlet-include-test-assembly
          --coverlet-include "[UiTests]UiTests.Framework.*"
          --coverlet-include "[UiTests]UiTests.PageObjects.*"
      - name: Validate semantic test and coverage evidence
        run: >-
          python .github/scripts/validate_test_evidence.py TestResults
          --min-tests 28
          --required-class UiTests.Tests.LoginTests=2
          --required-class UiTests.Tests.SeleniumCapabilitiesTests=2
          --min-line-rate 0.80
          --min-branch-rate 0.55
      - name: Publish CI observability summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p artifacts/ci
          jq -n \
            --arg runId "$TEST_RUN_ID" \
            --arg status "$JOB_STATUS" \
            --arg sha "$GITHUB_SHA" \
            --arg ref "$GITHUB_REF" \
            '{schemaVersion:1,framework:"selenium-xunit-v3-mtp",runId:$runId,dimension:{dotnet:"10.0.400",targetFramework:"net10.0",browser:"chrome",target:"local-fixture"},qualityFloor:{executedTests:28,loginTests:2,seleniumCapabilityTests:2,lineCoverage:0.80,branchCoverage:0.55},status:$status,sha:$sha,ref:$ref}' \
            > artifacts/ci/observability.json
          {
            echo '### Selenium / xUnit v3 / MTP · Chrome'
            echo
            echo "- Run ID: \`${TEST_RUN_ID}\`"
            echo "- Job status: \`${JOB_STATUS}\`"
            echo '- SDK: `10.0.400` (global.json exact pin + runtime assertion)'
            echo '- Test platform: native `Microsoft.Testing.Platform`'
            echo '- Target framework: `net10.0`'
            echo '- NuGet: committed dependency graph + `--locked-mode` + HIGH/CRITICAL audit-to-error policy'
            echo '- Target: repository-owned loopback fixture'
            echo '- Evidence floor: at least `28` executed tests, including >=2 LoginTests and >=2 SeleniumCapabilitiesTests; all passing; Cobertura counters must reconcile; line coverage `>=80%`; branch coverage `>=55%`'
            echo '- Evidence: MTP TRX + coverlet.MTP Cobertura + browser failure artifacts + CI observability envelope'
          } | tee artifacts/ci/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dotnet-selenium-evidence
          path: |
            TestResults/
            artifacts/
          if-no-files-found: error
          retention-days: 14

  ci-gate:
    name: ci-gate
    if: always()
    needs: [test]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Evaluate required CI jobs
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          if [[ "$TEST_RESULT" != "success" ]]; then
            echo "required CI job failed: test=$TEST_RESULT" >&2
            exit 1
          fi
          echo 'Required CI jobs succeeded.'
