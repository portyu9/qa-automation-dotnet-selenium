name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dotnet-selenium-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TEST_BASE_URL: http://127.0.0.1:3200
      TEST_BROWSER: chrome
      TEST_HEADLESS: "true"
      TEST_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 8.0.424
      - name: Restore
        run: dotnet restore UiTests.csproj
      - name: Build
        run: dotnet build UiTests.csproj --configuration Release --no-restore
      - name: Test against repository-owned loopback fixture
        run: >-
          dotnet test UiTests.csproj
          --configuration Release
          --no-build
          --logger "trx;LogFileName=tests.trx"
          --results-directory TestResults
          --collect "XPlat Code Coverage"
      - name: Publish CI observability summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p artifacts/ci
          jq -n \
            --arg runId "$TEST_RUN_ID" \
            --arg status "$JOB_STATUS" \
            --arg sha "$GITHUB_SHA" \
            --arg ref "$GITHUB_REF" \
            '{schemaVersion:1,framework:"selenium-xunit-v3",runId:$runId,dimension:{dotnet:"8.0.424",browser:"chrome",target:"local-fixture"},status:$status,sha:$sha,ref:$ref}' \
            > artifacts/ci/observability.json
          {
            echo '### Selenium / xUnit v3 · Chrome'
            echo
            echo "- Run ID: \`${TEST_RUN_ID}\`"
            echo "- Job status: \`${JOB_STATUS}\`"
            echo '- SDK: `8.0.424` (global.json exact pin)'
            echo '- Target: repository-owned loopback fixture'
            echo '- Evidence: TRX + Cobertura coverage + browser failure artifacts + CI observability envelope'
          } | tee artifacts/ci/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dotnet-selenium-evidence
          path: |
            TestResults/
            artifacts/
          if-no-files-found: ignore
          retention-days: 14
