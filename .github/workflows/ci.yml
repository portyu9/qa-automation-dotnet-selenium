name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dotnet-selenium-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TEST_BASE_URL: http://127.0.0.1:3200
      TEST_BROWSER: chrome
      TEST_HEADLESS: "true"
      TEST_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400
      - name: Verify pinned SDK and MTP runner selection
        run: |
          dotnet --version
          grep -F '"runner": "Microsoft.Testing.Platform"' global.json
      - name: Restore locked dependency graph and audit HIGH/CRITICAL advisories
        run: dotnet restore UiTests.csproj --locked-mode
      - name: Build with warnings as errors
        run: dotnet build UiTests.csproj --configuration Release --no-restore
      - name: Test against repository-owned loopback fixture
        run: >-
          dotnet test UiTests.csproj
          --configuration Release
          --no-build
          --results-directory TestResults
          --report-trx
          --report-trx-filename tests.trx
          --coverlet
          --coverlet-output-format cobertura
          --coverlet-include-test-assembly
          --coverlet-include "[UiTests]UiTests.Framework.*"
          --coverlet-include "[UiTests]UiTests.PageObjects.*"
      - name: Validate meaningful framework coverage evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          reports = sorted(Path("TestResults").rglob("coverage.cobertura.*.xml"))
          if len(reports) != 1:
              raise SystemExit(f"expected exactly one Cobertura report, found {len(reports)}: {reports}")
          root = ET.parse(reports[0]).getroot()
          lines_valid = int(root.attrib.get("lines-valid", "0"))
          packages = root.find("packages")
          package_count = len(list(packages)) if packages is not None else 0
          if lines_valid <= 0 or package_count <= 0:
              raise SystemExit(
                  f"coverage report is structurally empty: lines-valid={lines_valid}, packages={package_count}"
              )
          print(f"coverage contract: {reports[0]} lines-valid={lines_valid} packages={package_count}")
          PY
      - name: Publish CI observability summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p artifacts/ci
          jq -n \
            --arg runId "$TEST_RUN_ID" \
            --arg status "$JOB_STATUS" \
            --arg sha "$GITHUB_SHA" \
            --arg ref "$GITHUB_REF" \
            '{schemaVersion:1,framework:"selenium-xunit-v3-mtp",runId:$runId,dimension:{dotnet:"10.0.400",targetFramework:"net10.0",browser:"chrome",target:"local-fixture"},status:$status,sha:$sha,ref:$ref}' \
            > artifacts/ci/observability.json
          {
            echo '### Selenium / xUnit v3 / MTP · Chrome'
            echo
            echo "- Run ID: \`${TEST_RUN_ID}\`"
            echo "- Job status: \`${JOB_STATUS}\`"
            echo '- SDK: `10.0.400` (global.json exact pin)'
            echo '- Test platform: native `Microsoft.Testing.Platform`'
            echo '- Target framework: `net10.0`'
            echo '- NuGet: committed dependency graph + `--locked-mode` + HIGH/CRITICAL audit-to-error policy'
            echo '- Target: repository-owned loopback fixture'
            echo '- Coverage scope: `UiTests.Framework.*` + `UiTests.PageObjects.*`; structurally empty Cobertura is rejected'
            echo '- Evidence: MTP TRX + coverlet.MTP Cobertura + browser failure artifacts + CI observability envelope'
          } | tee artifacts/ci/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dotnet-selenium-evidence
          path: |
            TestResults/
            artifacts/
          if-no-files-found: ignore
          retention-days: 14
