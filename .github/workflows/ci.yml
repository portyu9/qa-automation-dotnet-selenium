name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dotnet-selenium-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TEST_BASE_URL: https://www.saucedemo.com
      TEST_BROWSER: chrome
      TEST_HEADLESS: "true"
      TEST_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore UiTests.csproj
      - name: Build
        run: dotnet build UiTests.csproj --configuration Release --no-restore
      - name: Test
        run: >-
          dotnet test UiTests.csproj
          --configuration Release
          --no-build
          --logger "trx;LogFileName=tests.trx"
          --results-directory TestResults
          --collect "XPlat Code Coverage"
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-selenium-evidence
          path: |
            TestResults/
            artifacts/
          if-no-files-found: ignore
          retention-days: 14
