name: extended

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "Framework/**"
      - "PageObjects/**"
      - "Tests/**"
      - "UiTests.csproj"
      - "global.json"
      - ".github/workflows/extended.yml"
  schedule:
    - cron: "47 7 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dotnet-extended-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    env:
      TEST_BASE_URL: http://127.0.0.1:3200
      TEST_BROWSER: ${{ matrix.browser }}
      TEST_HEADLESS: "true"
      TEST_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 8.0.424
      - name: Restore
        run: dotnet restore UiTests.csproj
      - name: Release build
        run: dotnet build UiTests.csproj --configuration Release --no-restore
      - name: Run xUnit v3 suite in ${{ matrix.browser }} against repository-owned fixture
        run: >-
          dotnet test UiTests.csproj
          --configuration Release
          --no-build
          --logger "trx;LogFileName=${{ matrix.browser }}.trx"
          --results-directory TestResults/${{ matrix.browser }}
          --collect "XPlat Code Coverage"
      - name: Publish browser observability summary
        if: always()
        run: |
          mkdir -p "artifacts/ci-${{ matrix.browser }}"
          {
            echo "### Selenium / xUnit v3 · ${{ matrix.browser }}"
            echo
            echo "- Run ID: \`${TEST_RUN_ID}\`"
            echo "- Browser: \`${{ matrix.browser }}\`"
            echo '- SDK: `8.0.424` (global.json exact pin)'
            echo "- Target framework: \`net8.0\`"
            echo '- Target: repository-owned loopback fixture'
            echo "- Job status: \`${{ job.status }}\`"
            echo "- Evidence: TRX + Cobertura coverage + browser failure artifacts"
          } | tee "artifacts/ci-${{ matrix.browser }}/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload cross-browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: selenium-${{ matrix.browser }}-extended-evidence
          path: |
            TestResults/${{ matrix.browser }}/
            artifacts/
          if-no-files-found: ignore
          retention-days: 14
