name: extended

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "Framework/**"
      - "PageObjects/**"
      - "Tests/**"
      - "UiTests.csproj"
      - "global.json"
      - "packages.lock.json"
      - ".github/scripts/**"
      - ".github/workflows/extended.yml"
  schedule:
    - cron: "47 7 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dotnet-extended-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    env:
      TEST_BASE_URL: http://127.0.0.1:3200
      TEST_BROWSER: ${{ matrix.browser }}
      TEST_HEADLESS: "true"
      TEST_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400
      - name: Verify pinned SDK and MTP runner selection
        run: |
          dotnet --version
          grep -F '"runner": "Microsoft.Testing.Platform"' global.json
      - name: Restore locked dependency graph and audit HIGH/CRITICAL advisories
        run: dotnet restore UiTests.csproj --locked-mode
      - name: Release build with warnings as errors
        run: dotnet build UiTests.csproj --configuration Release --no-restore
      - name: Run xUnit v3 suite in ${{ matrix.browser }} against repository-owned fixture
        run: >-
          dotnet test UiTests.csproj
          --configuration Release
          --no-build
          --results-directory TestResults/${{ matrix.browser }}
          --report-trx
          --report-trx-filename ${{ matrix.browser }}.trx
          --coverlet
          --coverlet-output-format cobertura
          --coverlet-include-test-assembly
          --coverlet-include "[UiTests]UiTests.Framework.*"
          --coverlet-include "[UiTests]UiTests.PageObjects.*"
      - name: Validate semantic test and coverage evidence
        run: >-
          python .github/scripts/validate_test_evidence.py TestResults/${{ matrix.browser }}
          --min-tests 28
          --min-line-rate 0.80
          --min-branch-rate 0.55
      - name: Publish browser observability summary
        if: always()
        run: |
          mkdir -p "artifacts/ci-${{ matrix.browser }}"
          jq -n \
            --arg runId "$TEST_RUN_ID" \
            --arg browser '${{ matrix.browser }}' \
            --arg status '${{ job.status }}' \
            --arg sha "$GITHUB_SHA" \
            --arg ref "$GITHUB_REF" \
            '{schemaVersion:1,framework:"selenium-xunit-v3-mtp",runId:$runId,dimension:{dotnet:"10.0.400",targetFramework:"net10.0",browser:$browser,target:"local-fixture"},qualityFloor:{executedTests:28,lineCoverage:0.80,branchCoverage:0.55},status:$status,sha:$sha,ref:$ref}' \
            > "artifacts/ci-${{ matrix.browser }}/observability.json"
          {
            echo "### Selenium / xUnit v3 / MTP · ${{ matrix.browser }}"
            echo
            echo "- Run ID: \`${TEST_RUN_ID}\`"
            echo "- Browser: \`${{ matrix.browser }}\`"
            echo '- SDK: `10.0.400` (global.json exact pin)'
            echo '- Test platform: native `Microsoft.Testing.Platform`'
            echo '- NuGet: committed dependency graph + `--locked-mode` + HIGH/CRITICAL audit-to-error policy'
            echo '- Target framework: `net10.0`'
            echo '- Target: repository-owned loopback fixture'
            echo '- Evidence floor: at least `28` executed tests, all passing; Cobertura counters must reconcile; line coverage `>=80%`; branch coverage `>=55%`'
            echo "- Job status: \`${{ job.status }}\`"
            echo '- Evidence: MTP TRX + coverlet.MTP Cobertura + browser failure artifacts + observability envelope'
          } | tee "artifacts/ci-${{ matrix.browser }}/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload cross-browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: selenium-${{ matrix.browser }}-extended-evidence
          path: |
            TestResults/${{ matrix.browser }}/
            artifacts/ci-${{ matrix.browser }}/
          if-no-files-found: error
          retention-days: 14

  extended-gate:
    name: extended-gate
    if: always()
    needs: [cross-browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Evaluate cross-browser matrix
        env:
          CROSS_BROWSER_RESULT: ${{ needs.cross-browser.result }}
        run: |
          if [[ "$CROSS_BROWSER_RESULT" != "success" ]]; then
            echo "cross-browser matrix did not succeed: $CROSS_BROWSER_RESULT" >&2
            exit 1
          fi
          echo 'Chrome and Firefox extended lanes succeeded.'
